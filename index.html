<!DOCTYPE html>
<html lang="en">
<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Credit Card Interface</title>
       <link rel="stylesheet" href="stylesheet/out.css">
</head>
<body>
       <section class="w-full p-2.5 flex items-center justify-center  bg-linear-to-t from-violet to-pale-lavender min-h-screen">
              <div class=" flex flex-wrap w-full lg:w-1/3 gap-2.5 ">
                     <header class="headerTop row p-5 gap-5  bg-off-white  shadow-gray/50 shadow-[2px_2px_2px] rounded-[10px]">
                            <div class="circles">
                                   <span class="fillCircle bg-indigo">
                                          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="white" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
</svg>

                                   </span>
                                   <span class="fillCircle circleBefore before:right-[calc(50%+20px)]"></span>
                                   <span class="fillCircle circleBefore"></span>
                            </div>
                            <div class="row">
                                   <h3 class="title">Products</h3>
                            </div>
                     </header>
                     <div class="row paymentSection">
                            <div class="products gap-2.5">
                                   <div class="row mb-10">
                                          <h3 class="text-2xl text-center w-full">Summary</h3>
                                   </div>
                                   <div class="row gap-2">
                                          <div class="summery">

                                          </div>
                                          <div class="quantity">
                                                 <span class="quantityItems">+</span>
                                                 <span class="quantityItems">1</span>
                                                 <span class="quantityItems">-</span>
                                          </div>
                                   </div>
                                   <div class="row gap-2">
                                          <div class="summery">

                                          </div>
                                          <div class="quantity">
                                                 <span class="quantityItems">+</span>
                                                 <span class="quantityItems">1</span>
                                                 <span class="quantityItems">-</span>
                                          </div>
                                   </div>
                                   <div class="row gap-5 mt-10">
                                          <div class="details">
                                                 <h4 class="font-bold text-charcoal">Subtotal</h4>
                                                 <span class="text-black/50">34</span>
                                          </div>
                                          <div class="details">
                                                 <h4 class="font-bold text-charcoal">VAT</h4>
                                                 <span class="text-black/50">2456</span>
                                          </div>
                                          <div class="details">
                                                 <h4 class="font-bold text-charcoal">Total</h4>
                                                 <span class="text-black/50">987676</span>
                                          </div>
                                   </div>
                                   <div class="row justify-center items-center mt-12.5">
                                          <a class="link">
                                                 <span>buy now</span>
                                          </a>
                                   </div>
                            </div>
                            <div class="checkout">
                                   checkout

                                   <a class="link">
                                                 <span>buy now</span>
                                          </a>
                            </div>
                            <div class="newCard">
                                   newcard
                            </div>
                     </div>
              </div>
       </section>
</body>
<script src="js/script.js"></script>
</html>
